model:
    correlation: 0.8
    model_name: ddim
    lr: 1.0e-4
    optimizer: muon
    muon_lr_mult: 10.0          # Muon lr = lr * muon_lr_mult
    weight_decay: 0.01
    latent: True
    sfno:
        img_size: [64, 128]
        in_chans: 81 # 8 surface + 65 multilevel + 2 scalars + 6 grid
        out_chans: 73 # 8 surface + 65 multilevel
        big_skip: True
        pos_embed: False
        embed_dim: 512
        num_layers: 12
        scale_factor: 1
        normalization_layer: "instance_norm"
        activation_function: "gelu"
        encoder_layers: 1
        use_mlp: True
    ddpm:
        noise_steps: 100
        scale: 400
        skip_percent: 0
        beta_start: 1.0e-4
        beta_end: 0.02
        schedule: linear
    ddim:
        noise_steps: 100
        scale: 400
        skip_percent: 0
        beta_start: 1.0e-4
        beta_end: 0.02
        schedule: linear
        num_ddim_steps: 10
    tsm:
        noise_steps: 100
        scale: 400
        skip_percent: 0
        beta_start: 1.0e-4
        beta_end: 0.02
        schedule: linear
        skip_percent: 0.9
    edm:
        num_steps: 10
        solver: euler       # euler (NFE = num_steps) or heun (NFE = 2*num_steps - 1)
        stochastic: False   # False = probability-flow ODE, True = Karras-churn SDE
    flow_matching:
        num_refinement_steps: 5
        num_train_steps: 11
        continuous_t: True
        t_scale: 1000.0
    interpolant:
        num_refinement_steps: 5
        num_train_steps: 101
        sigma_coef: 0.5
        integrator: em
        continuous_t: True
        t_scale: 1000.0
    dit:
        in_dim: 64
        out_dim: 32
        dim: 1024
        cond_dim: 1024
        depth_dropout: 0.0
        kernel_expansion_ratio: 1.0
        l_max: 20
        num_heads: 16
        num_fa_blocks: 0
        num_ca_blocks: 6
        num_sa_blocks: 12
        num_cond: 2
        num_constants: 6
        patch_size: 4
        proj_bottleneck_dim: 1024
        scale_by_sigma: true
    autoencoder:
        model:
            model_name: AE
            lr: 8.0e-5
            multilevel_dim: 65
            surface_dim: 8
            channel_dim: 128
            kl_weight: 2.0e-07
            latent_dim: 32
        training:
            log_dir: logs/
            strategy: auto
        scale_factor: 1.0
        checkpoint: /path/to/data/data/pde/logs/ClimaAE_AE_cnn_base_ddp_2025-06-04T16-32-00/last.ckpt
        data:
            pde: climate
            nlat: 64
            nlon: 128

data:
    dataset:
        train_data_path: /path/to/data/data/pde/plasim/PLASIM_train_146096.h5
        val_data_path: /path/to/data/data/pde/plasim/PLASIM_valid_1460.h5
        train_times_path: /path/to/data/data/pde/plasim/PLASIM_train_146096_times.pkl
        val_times_path: /path/to/data/data/pde/plasim/PLASIM_valid_1460_times.pkl
        boundary_path: /path/to/data/data/pde/plasim/boundary_vars.h5

        training_nsteps: 1
        val_nsteps: 40
    normalizer:
        norm_stats_path: /path/to/data/data/pde/plasim/norm_stats.npz

    nlat: 64
    nlon: 128
    with_poles: False
    load_into_memory: False
    normalize: True
    batch_size: 32
    num_workers: 16
    pde: climate
    ae: False
    num_val_batches: 16
    val_subset_seed: 0      # fixed val subset, independent of training.seed
    val_batch_size: 8
    val_num_workers: 2

training:
    seed: 42
    devices: 1
    accelerator: gpu
    strategy: auto
    log_every_n_steps: 100
    eval_all: False
    log_dir: /path/to/data/logs/
    project: stochastic_interpolants_rev
    wandb_mode: online
    checkpoint: null
    ema_decay: 0.995            # null or 0 disables EMA
    max_steps: 100_000             # overrides max_epochs when set
    val_every_n_steps: 1000
    save_every_n_train_steps: 1000      # refresh last.ckpt
    archive_every_n_train_steps: 10_000  # keep a permanent model_step_*.ckpt
    save_best: False             # keep the best checkpoint by val metric
    lr_decay_every_n_steps: 1000
    lr_decay_gamma: 0.99
