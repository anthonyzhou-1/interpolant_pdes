model:
    correlation: 0.8
    model_name: ddim
    lr: 1.0e-4
    optimizer: muon
    muon_lr_mult: 10.0          # Muon lr = lr * muon_lr_mult
    weight_decay: 0.01
    latent: True
    fno2d:
        in_channels: 1
        out_channels: 1
        modes1: 16
        modes2: 16
        hidden_channels: 64
        cond_channels: 0
        cond_dim: 0
        num_layers: 5
    ddpm:
        noise_steps: 100
        scale: 400
        skip_percent: 0
        beta_start: 1.0e-4
        beta_end: 0.02
        schedule: linear
    ddim:
        noise_steps: 100
        scale: 400
        skip_percent: 0
        beta_start: 1.0e-4
        beta_end: 0.02
        schedule: linear
        num_ddim_steps: 10
    tsm:
        noise_steps: 100
        scale: 400
        skip_percent: 0
        beta_start: 1.0e-4
        beta_end: 0.02
        schedule: linear
        skip_percent: 0.99
    edm:
        num_steps: 10
        solver: euler       # euler (NFE = num_steps) or heun (NFE = 2*num_steps - 1)
        stochastic: False   # False = probability-flow ODE, True = Karras-churn SDE
    flow_matching:
        num_refinement_steps: 2
        num_train_steps: 5
        continuous_t: True
        t_scale: 1000.0
    interpolant:
        num_refinement_steps: 2
        num_train_steps: 5
        sigma_coef: 1.0
        beta_fn: t
        integrator: euler
        antithetic_sampling: True
        continuous_t: True
        t_scale: 1000.0
    dit:
        in_dim: 8
        out_dim: 4
        dim: 512
        num_heads: 16
        num_layers: 12
        patch_size: [1, 1]
        input_size: [20, 20]
        cond_dim: 512
    autoencoder:
        model:
            model_name: AE
            lr: 1.0e-4
            encoder:
                in_channels: 1
                latent_channels: 4
                width_list: [64, 128, 256, 256]
                block_type: ["ResBlock", "ResBlock", "ResBlock", "ResBlock"]
                depth_list: [3, 3, 3, 3]
            decoder:
                in_channels: 1
                latent_channels: 4
                width_list: [64, 128, 256, 256]
                block_type: ["ResBlock", "ResBlock", "ResBlock", "ResBlock"]
                depth_list: [3, 3, 3, 3]
        training:
            log_dir: logs/
            strategy: auto
        data:
            pde: km_flow
        scale_factor: 1.0
        checkpoint: /path/to/data/data/pde/logs/AE__2025-07-10T16-17-36/last.ckpt

data:
    dataset:
        train_path: /path/to/data/data/pde/KmFlow/KolmFlow_train_1024.h5
        valid_path: /path/to/data/data/pde/KmFlow/KolmFlow_valid_256.h5
        resolution: [100, 160, 160]
        # dt_stride (lead time in raw timesteps) defaults to 2; override with --dt_stride
    normalizer:
        stat_path: /path/to/data/data/pde/KmFlow/KolmFlow_train_norm_stats.pkl
    pde: km_flow
    num_workers: 8
    batch_size: 32
    num_val_batches: 8
    val_subset_seed: 0      # fixed val subset, independent of training.seed

training:
    seed: 42
    devices: 1
    accelerator: gpu
    strategy: auto
    log_every_n_steps: 20
    eval_all: False
    log_dir: /path/to/data/logs/
    project: stochastic_interpolants_rev
    wandb_mode: online
    checkpoint: null
    ema_decay: 0.99            # null or 0 disables EMA
    max_steps: 25_000             # overrides max_epochs when set
    val_every_n_steps: 1000
    save_every_n_train_steps: 1000      # refresh last.ckpt
    archive_every_n_train_steps: 5000  # keep a permanent model_step_*.ckpt
    save_best: True             # keep the best checkpoint by val metric
    lr_decay_every_n_steps: 250
    lr_decay_gamma: 0.99
